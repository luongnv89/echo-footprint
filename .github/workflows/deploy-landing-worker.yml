name: Deploy landing markdown worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/landing-markdown/**'
      - 'landing-page/lib/**'
      - 'landing-page/index.md'
      - 'landing-page/privacy.md'
      - '.github/workflows/deploy-landing-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/landing-markdown
          command: deploy
