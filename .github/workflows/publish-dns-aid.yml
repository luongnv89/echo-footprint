name: Publish DNS-AID records

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show zone template
        run: bash scripts/publish-dns-aid.sh show

      - name: Publish to Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          bash scripts/publish-dns-aid.sh publish
          bash scripts/publish-dns-aid.sh dnssec || true

      - name: Verify agent-readiness dnsAid
        run: bash scripts/publish-dns-aid.sh verify
        continue-on-error: true
