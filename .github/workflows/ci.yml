name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash # explicit bash runs with -eo pipefail, so a vitest failure fails the step through the tee pipe
        run: npm run test:run 2>&1 | tee test-output.txt

      - name: Record pass rate in job summary
        if: always()
        run: |
          if [ -s test-output.txt ]; then
            printf '## Test pass rate\n\n' >> "$GITHUB_STEP_SUMMARY"
            grep -E "Test Files|Tests " test-output.txt >> "$GITHUB_STEP_SUMMARY" || echo "No summary found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create ZIP artifact
        run: npm run zip

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: echofootprint-chrome
          path: dist/echofootprint.zip
          retention-days: 30

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: dist-chrome
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    permissions:
      contents: write # required by softprops/action-gh-release to upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Chrome artifact
        uses: actions/download-artifact@v4
        with:
          name: echofootprint-chrome

      - name: Rename asset for release
        run: mv echofootprint.zip echofootprint-${{ github.event.release.tag_name }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: echofootprint-${{ github.event.release.tag_name }}.zip

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for TruffleHog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run npm audit gate
        # Hardens the security job per modernization task 1.8: no
        # `continue-on-error`, so a new high/critical dependency
        # vulnerability fails the PR. The known-and-deferred high/critical
        # finding (vite path-traversal) lives in the allowlist inside
        # scripts/audit-gate.cjs with an owner and reason so the gate
        # is auditable and easy to prune. Per issue #22, the allowlist
        # contains only vite until the P2 vite 8 major bump (#2.2);
        # esbuild's current advisory is moderate and the gate only acts
        # on high/critical, so it stays out of the allowlist and is
        # visible in the job log.
        run: npm audit --json --audit-level=low | node scripts/audit-gate.cjs

      # TruffleHog scans for accidentally committed secrets (API keys, tokens, etc.)
      # Separate steps for push/PR events to use correct commit SHAs
      - name: Check for secrets (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
        continue-on-error: false

      - name: Check for secrets (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
        continue-on-error: false
